        // ===== DRIVER BADGES =====
        function renderDriverBadges() {
            const container = document.getElementById('driverBadges');
            container.innerHTML = '';
            const entries = Object.entries(drivers);
            if (entries.length === 0) {
                container.innerHTML =
                    '<span style="color:var(--muted); font-size:13px; background:rgba(0,0,0,0.6); padding:4px 12px; border-radius:20px;">No drivers — add in Settings</span>';
                return;
            }
            for (let [id, drv] of entries) {
                const badge = document.createElement('div');
                badge.className = 'driver-badge';
                badge.dataset.driverId = id;
                badge.style.borderLeftColor = drv.color || '#f7c948';
                const devId = drv.deviceId ? parseInt(String(drv.deviceId).trim(), 10) : null;
                const status = getGPSStatus(drv.lastLocation?.updatedAt, devId);
                let lastUpdateText = '—';
                if (drv.lastLocation?.updatedAt) {
                    const mins = ((Date.now() - drv.lastLocation.updatedAt) / 60000).toFixed(0);
                    lastUpdateText = `${mins}m`;
                }
                badge.innerHTML = `
              <span class="dot" style="background:${drv.color || '#f7c948'}"></span>
              ${drv.name || 'Driver'} 
              <span class="status-indicator ${status.class}">${status.label}</span>
              <span class="last-update">${lastUpdateText}</span>
            `;
                // Click = open driver modal
                badge.addEventListener('click', function(e) {
                    // If in assignment mode, don't open modal, just use for drop
                    if (!assignmentModeActive) {
                        zoomToDriver(id);
                    }
                });

                // Drag and drop events for driver badge as drop target
                badge.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    this.classList.add('drag-over');
                });
                badge.addEventListener('dragleave', function(e) {
                    this.classList.remove('drag-over');
                });
                badge.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('drag-over');
                    const stopId = dragStopId || e.dataTransfer.getData('text/plain');
                    if (stopId && drivers[id]) {
                        assignStop(stopId, id);
                        renderStopList();
                        if (activeModalDriverId) renderDriverStops(activeModalDriverId);
                        // Show a quick visual feedback
                        this.style.borderColor = '#2ecc71';
                        this.style.boxShadow = '0 0 20px rgba(46,204,113,0.6)';
                        setTimeout(() => {
                            this.style.borderColor = '';
                            this.style.boxShadow = '';
                        }, 800);
                    }
                });

                container.appendChild(badge);
            }
            updateMapDriverControl();
        }

        function zoomToDriver(driverId) {
            const drv = drivers[driverId];
            if (!drv || !drv.lastLocation) return;
            if (map) {
                map.panTo({ lat: drv.lastLocation.lat, lng: drv.lastLocation.lng });
                map.setZoom(14);
            }
            openDriverModal(driverId);
        }

        // ===== DRIVER MODAL =====
        function openDriverModal(driverId) {
            document.getElementById('driverModal').style.display = 'flex';
            activeModalDriverId = driverId;
            const drv = drivers[driverId];
            document.getElementById('driverModalTitle').innerHTML = `Driver`;
            if (modalPulseCircle) {
                modalPulseCircle.setMap(null);
                modalPulseCircle = null;
            }
            stopModalPulse();

            setTimeout(() => {
                const container = document.getElementById('driver-map');
                const isLight = document.body.classList.contains('light-mode');
                if (!container._map) {
                    container._map = new google.maps.Map(container, {
                        center: drv?.lastLocation ? { lat: drv.lastLocation.lat, lng: drv.lastLocation.lng } :
                        { lat: 49.8425, lng: -99.9497 },
                        zoom: 13,
                        styles: isLight ? [] : mapStyles,
                        gestureHandling: 'greedy',
                        mapTypeControl: false
                    });
                    const fitControlDiv = document.createElement('div');
                    fitControlDiv.innerHTML = `
                <button class="map-fit-btn" aria-label="Fit all stops">
                  <svg viewBox="0 0 24 24"><path d="M3 3v6h2V5h4V3H3zm16 0v6h2V3h-6v2h4zM3 21v-6h2v4h4v2H3zm16 0v-6h2v6h-6v-2h4z"/><rect x="5" y="5" width="14" height="14" rx="1" stroke="currentColor" fill="none"/></svg>
                </button>
              `;
                    const fitButton = fitControlDiv.querySelector('.map-fit-btn');
                    fitButton.addEventListener('click', function(e) {
                        e.stopPropagation();
                        fitDriverMapToStops(container._map, driverId);
                    });
                    container._map.controls[google.maps.ControlPosition.BOTTOM_RIGHT].push(fitControlDiv);
                }
                const mmap = container._map;
                if (drv?.lastLocation) {
                    mmap.panTo({ lat: drv.lastLocation.lat, lng: drv.lastLocation.lng });
                    mmap.setZoom(14);
                }
                if (container._markers) container._markers.forEach(m => m.setMap(null));
                container._markers = [];
                if (drv?.lastLocation) {
                    const color = drv.color || '#f7c948';
                    const icon = getDriverIcon(drv.name || 'Driver', color);
                    const mk = new google.maps.Marker({
                        position: { lat: drv.lastLocation.lat, lng: drv.lastLocation.lng },
                        map: mmap,
                        icon: icon
                    });
                    mk.addListener('dblclick', function() {
                        openGoogleMaps(drv.lastLocation.lat, drv.lastLocation.lng);
                    });
                    container._markers.push(mk);

                    modalPulseCircle = new google.maps.Circle({
                        center: { lat: drv.lastLocation.lat, lng: drv.lastLocation.lng },
                        radius: 15,
                        fillColor: color,
                        fillOpacity: 0.2,
                        strokeColor: color,
                        strokeOpacity: 0.6,
                        strokeWeight: 2,
                        map: mmap
                    });
                    startModalPulse(modalPulseCircle);

                    reverseGeocode(drv.lastLocation.lat, drv.lastLocation.lng)
                        .then(address => {
                            const link =
                                `<a href="https://www.google.com/maps?q=${drv.lastLocation.lat},${drv.lastLocation.lng}" target="_blank" style="color:var(--accent); text-decoration:underline;">${address}</a>`;
                            document.getElementById('driverAddress').innerHTML = '📍 ' + link;
                        })
                        .catch(() => {
                            document.getElementById('driverAddress').innerHTML =
                                '📍 <span style="color:var(--muted);">Address unavailable</span>';
                        });
                } else {
                    document.getElementById('driverAddress').innerHTML = '';
                }

                const allStops = currentDay === 'today' ? stopsToday : stopsTomorrow;
                const assigned = Object.entries(allStops).filter(([id, s]) => s.assignedDriver === driverId && s.status !==
                    'completed');
                // Remove any existing polyline (we don't use it)
                if (container._polyline) {
                    container._polyline.setMap(null);
                    container._polyline = null;
                }
                // No polyline added
                assigned.forEach(([id, s]) => {
                    if (s.lat && s.lng) {
                        const mk = new google.maps.Marker({
                            position: { lat: s.lat, lng: s.lng },
                            map: mmap,
                            label: { text: s.name || 'Stop', color: '#00b32d', fontSize: '11px',
                                className: 'driver-map-label' },
                            icon: { path: google.maps.SymbolPath.CIRCLE, scale: 10, fillColor: '#2ecc71',
                                fillOpacity: 0.8, strokeColor: '#fff', strokeWeight: 1 }
                        });
                        mk.addListener('dblclick', function() {
                            openGoogleMaps(s.lat, s.lng);
                        });
                        container._markers.push(mk);
                    }
                });
                renderDriverStops(driverId);
                const devId = drv.deviceId ? parseInt(String(drv.deviceId).trim(), 10) : null;
                const status = getGPSStatus(drv?.lastLocation?.updatedAt, devId);
                const lastUp = drv?.lastLocation ? ((Date.now() - drv.lastLocation.updatedAt) / 60000).toFixed(0) : '—';
                document.getElementById('driverLastUpdate').textContent =
                `Status: ${status.label} · Last update: ${lastUp}m ago`;
                document.getElementById('driverStopCount').textContent = `${assigned.length} stops`;
            }, 200);
        }

        function fitDriverMapToStops(mapInstance, driverId) {
            const allStops = currentDay === 'today' ? stopsToday : stopsTomorrow;
            const assigned = Object.entries(allStops).filter(([id, s]) => s.assignedDriver === driverId && s.lat && s.lng);
            const bounds = new google.maps.LatLngBounds();
            let hasPoints = false;
            assigned.forEach(([id, s]) => {
                if (s.lat && s.lng) {
                    bounds.extend({ lat: s.lat, lng: s.lng });
                    hasPoints = true;
                }
            });
            const drv = drivers[driverId];
            if (drv && drv.lastLocation) {
                bounds.extend({ lat: drv.lastLocation.lat, lng: drv.lastLocation.lng });
                hasPoints = true;
            }
            if (hasPoints) {
                mapInstance.fitBounds(bounds);
            }
        }

        function closeDriverModal() {
            document.getElementById('driverModal').style.display = 'none';
            activeModalDriverId = null;
            if (modalPulseCircle) {
                modalPulseCircle.setMap(null);
                modalPulseCircle = null;
            }
            stopModalPulse();
        }

        function renderDriverStops(driverId) {
            const container = document.getElementById('driverModalStops');
            const allStops = currentDay === 'today' ? stopsToday : stopsTomorrow;
            const assigned = Object.entries(allStops).filter(([id, s]) => s.assignedDriver === driverId);
            container.innerHTML = '';
            if (assigned.length === 0) { container.innerHTML =
                '<div style="color:var(--muted);padding:12px;">No assigned stops</div>'; return; }
            assigned.sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
            const driverColor = drivers[driverId]?.color || '#f7c948';
            assigned.forEach(([id, s]) => {
                const div = document.createElement('div');
                const isCompleted = s.status === 'completed';
                const isAssigned = !!s.assignedDriver;
                const bgColor = isAssigned && !isCompleted ? `${driverColor}33` : '';
                div.className = `stop-item ${isCompleted ? 'completed' : ''} ${isAssigned ? 'assigned' : ''}`;
                div.style.borderLeftColor = driverColor;
                if (bgColor) div.style.background = bgColor;
                const ts = isCompleted ?
                    `<span class="timestamp">✓ ${s.completedAt ? new Date(s.completedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''}</span>` :
                    '';
                div.setAttribute('title', `${s.address || ''} ${s.city || ''}`.trim());
                div.innerHTML = `
              <div class="info" onclick="zoomToStop('${id}')">
                <div class="name">${s.name || 'No name'} ${ts}</div>
                <div class="addr">${s.address || ''} ${s.city || ''}</div>
              </div>
              <div class="actions">
                ${isCompleted ? `<button onclick="reopenStop('${id}')" title="Re-open">↺</button>` : `<button onclick="completeStop('${id}')" title="Complete">👍</button>`}
                <button onclick="moveToTomorrow('${id}')" title="Move">➡️</button>
              </div>
            `;
                container.appendChild(div);
            });
        }

        // ===== STOP LIST =====
        function renderStopList() {
            const container = document.getElementById('stopList');
            const empty = document.getElementById('emptyMsg');
            const allStops = currentDay === 'today' ? stopsToday : stopsTomorrow;

            let entries = Object.entries(allStops);
            const searchQueryLower = searchQuery.toLowerCase().trim();
            if (searchQueryLower) {
                entries = entries.filter(([id, s]) => {
                    const name = (s.name || '').toLowerCase();
                    const address = (s.address || '').toLowerCase();
                    const city = (s.city || '').toLowerCase();
                    return name.includes(searchQueryLower) || address.includes(searchQueryLower) || city.includes(
                        searchQueryLower);
                });
            }

            if (entries.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
                if (searchQueryLower) {
                    empty.textContent = 'No stops match your search.';
                } else {
                    empty.textContent = 'No stops — add one above.';
                }
                return;
            }
            empty.style.display = 'none';

            entries.sort((a, b) => {
                if (a[1].status === 'completed' && b[1].status !== 'completed') return 1;
                if (a[1].status !== 'completed' && b[1].status === 'completed') return -1;
                return (a[1].order || 0) - (b[1].order || 0);
            });

            const getFullAddress = (s) => {
                const parts = [];
                if (s.address) parts.push(s.address);
                if (s.city) parts.push(s.city);
                return parts.join(', ') || 'No address';
            };

            let html = '';
            for (let [id, s] of entries) {
                const isCompleted = s.status === 'completed';
                const isAssigned = !!s.assignedDriver;
                const driverColor = s.assignedDriver && drivers[s.assignedDriver] ? drivers[s.assignedDriver].color :
                '#555';
                const fullAddr = getFullAddress(s);

                let extraClasses = '';
                let infoOnClick = `handleStopClick('${id}')`;
                let infoCursor = 'pointer';

                if (assignmentModeActive && selectedDriverForAssignment) {
                    if (isAssigned) {
                        extraClasses += ' greyed-out';
                        infoOnClick = `handleStopClick('${id}')`;
                        infoCursor = 'default';
                    } else if (!isCompleted) {
                        extraClasses += ' highlight-unassigned';
                        infoOnClick = `handleStopClick('${id}')`;
                        infoCursor = 'pointer';
                    }
                }

                const ts = isCompleted ?
                    `<span class="timestamp">✓ ${s.completedAt ? new Date(s.completedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''}</span>` :
                    '';

                let bgColor = '';
                if (isAssigned && !isCompleted) {
                    bgColor = driverColor + '33';
                }

                const driverName = s.assignedDriver && drivers[s.assignedDriver] ? drivers[s.assignedDriver].name : '';

                html += `
              <div class="stop-item ${isCompleted ? 'completed' : ''} ${isAssigned ? 'assigned' : ''} ${extraClasses}" 
                   data-id="${id}" 
                   style="border-left-color:${driverColor}; position:relative; ${bgColor ? 'background:'+bgColor+';' : ''}"
                   draggable="true"
                   data-stop-id="${id}"
                   data-stop-name="${s.name || ''}"
                   data-stop-address="${s.address || ''}"
                   data-stop-city="${s.city || ''}"
                   data-stop-driver="${driverName}"
              >
                <div class="info" onclick="${infoOnClick}" style="cursor:${infoCursor};">
                  <div class="name">${s.name || 'No name'} ${ts}</div>
                  <div class="addr">${s.address || ''} ${s.city || ''}</div>
                </div>
                <div class="actions">
                  <select class="assign-select" onchange="assignStop('${id}', this.value)" onclick="event.stopPropagation();">
                    <option value="">Unassign</option>
                    ${Object.entries(drivers).map(([did, d]) => `<option value="${did}" ${s.assignedDriver === did ? 'selected' : ''}>${d.name}</option>`).join('')}
                  </select>
                  ${isCompleted ? `<button onclick="reopenStop('${id}')" title="Re-open" style="pointer-events:auto;">↺</button>` : `<button onclick="completeStop('${id}')" title="Complete" style="pointer-events:auto;">👍</button>`}
                  <button onclick="moveToTomorrow('${id}')" title="Move" style="pointer-events:auto;">➡️</button>
                  <button onclick="deleteStop('${id}')" style="color:#e74c3c; pointer-events:auto;">✕</button>
                </div>
              </div>
            `;
            }
            container.innerHTML = html;

            // Attach drag events to stop items
            container.querySelectorAll('.stop-item').forEach(item => {
                item.addEventListener('dragstart', function(e) {
                    const stopId = this.dataset.stopId;
                    if (!stopId) return;
                    e.dataTransfer.setData('text/plain', stopId);
                    e.dataTransfer.effectAllowed = 'move';
                    this.classList.add('dragging');
                    // Store the stop ID for later
                    dragStopId = stopId;
                });
                item.addEventListener('dragend', function(e) {
                    this.classList.remove('dragging');
                    // Remove drag-over from all driver badges
                    document.querySelectorAll('.driver-badge.drag-over').forEach(b => b.classList.remove(
                    'drag-over'));
                    dragStopId = null;
                });

                // Double-click on name to show address overlay
                const nameEl = item.querySelector('.name');
                if (nameEl) {
                    nameEl.addEventListener('dblclick', function(e) {
                        e.stopPropagation();
                        const stopId = item.dataset.stopId;
                        if (stopId) showAddressOverlay(stopId);
                    });
                }
            });

            // Destroy previous Sortable instance
            if (sortableInstance) {
                sortableInstance.destroy();
                sortableInstance = null;
            }
            try {
                sortableInstance = new Sortable(container, {
                    animation: 150,
                    delay: 400,
                    delayOnTouchOnly: true,
                    onEnd: function(evt) {
                        const items = container.querySelectorAll('.stop-item');
                        const newOrder = Array.from(items).map(el => el.dataset.id);
                        const updates = {};
                        newOrder.forEach((id, idx) => { updates[`${id}/order`] = idx; });
                        const ref = currentDay === 'today' ? db.ref(
                            'developer/dispatch_dashboard/stops_today') : db.ref(
                            'developer/dispatch_dashboard/stops_tomorrow');
                        ref.update(updates);
                    }
                });
            } catch (e) {}
        }

        // ===== SEARCH BAR =====
        function filterStops() {
            const input = document.getElementById('manifestSearchInput');
            const clearBtn = document.getElementById('manifestSearchClear');
            searchQuery = input.value;
            if (searchQuery.length > 0) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }
            renderStopList();
        }

        function clearSearch() {
            document.getElementById('manifestSearchInput').value = '';
            document.getElementById('manifestSearchClear').classList.remove('visible');
            searchQuery = '';
            renderStopList();
        }

        // ===== COPY STOP NAMES =====
        function copyStopNames() {
            const todayStops = stopsToday || {};
            const tomorrowStops = stopsTomorrow || {};

            const names = [];

            Object.values(todayStops).forEach(s => {
                if (s.status !== 'completed' && s.name) {
                    names.push(s.name.trim());
                }
            });

            Object.values(tomorrowStops).forEach(s => {
                if (s.status !== 'completed' && s.name) {
                    names.push(s.name.trim());
                }
            });

            if (names.length === 0) {
                const btn = document.querySelector('.copy-btn-header');
                btn.textContent = '📋 No names';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 COPY';
                    btn.classList.remove('copied');
                }, 1500);
                return;
            }

            const text = names.join('\n');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.querySelector('.copy-btn-header');
                    btn.textContent = '✅ Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '📋 COPY';
                        btn.classList.remove('copied');
                    }, 2000);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const btn = document.querySelector('.copy-btn-header');
                btn.textContent = '✅ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 COPY';
                    btn.classList.remove('copied');
                }, 2000);
            } catch (e) {
                alert('Could not copy. Please select and copy manually:\n\n' + text);
            }
            document.body.removeChild(textarea);
        }

        // ===== STOP ACTIONS =====
        function addStop() {
            const name = document.getElementById('stopName').value.trim();
            const address = document.getElementById('stopAddress').value.trim();
            const city = document.getElementById('stopCity').value.trim();
            const assignedDriver = document.getElementById('stopDriver').value || null;
            if (!name || !address || !city) { alert('Fill all fields'); return; }
            const ref = currentDay === 'today' ? db.ref('developer/dispatch_dashboard/stops_today') : db.ref(
                'developer/dispatch_dashboard/stops_tomorrow');
            const geocoder = new google.maps.Geocoder();
            const fullAddress = address + ', ' + city + ', Canada';
            geocoder.geocode({ address: fullAddress }, function(results, status) {
                if (status === 'OK' && results && results.length > 0) {
                    const lat = results[0].geometry.location.lat();
                    const lng = results[0].geometry.location.lng();
                    ref.push({ name, address, city, assignedDriver, status: 'pending', completedAt: null, order: Date
                            .now(), lat, lng })
                        .then((newRef) => {
                            const sanitizedKey = name.replace(/[.#$\[\]\/]/g, "").trim();
                            const updateObj = {
                                address: address,
                                city: city,
                                last_edit_by: auth.currentUser ? auth.currentUser.email : 'unknown'
                            };
                            db.ref("address_lookup").child(sanitizedKey).update(updateObj);
                            updateMapMarkers();
                            document.getElementById('stopName').value = '';
                            document.getElementById('stopAddress').value = '';
                            document.getElementById('stopCity').value = '';
                        });
                } else {
                    alert('Could not geocode address: ' + status);
                }
            });
        }

        function completeStop(id) {
            const ref = currentDay === 'today' ? db.ref('developer/dispatch_dashboard/stops_today') : db.ref(
                'developer/dispatch_dashboard/stops_tomorrow');
            ref.child(id).update({ status: 'completed', completedAt: Date.now() }).then(() => {
                if (activeModalDriverId) renderDriverStops(activeModalDriverId);
                updateMapMarkers();
            });
        }

        function reopenStop(id) {
            const ref = currentDay === 'today' ? db.ref('developer/dispatch_dashboard/stops_today') : db.ref(
                'developer/dispatch_dashboard/stops_tomorrow');
            ref.child(id).update({ status: 'pending', completedAt: null }).then(() => {
                if (activeModalDriverId) renderDriverStops(activeModalDriverId);
                updateMapMarkers();
            });
        }

        function assignStop(id, driverId) {
            const ref = currentDay === 'today' ? db.ref('developer/dispatch_dashboard/stops_today') : db.ref(
                'developer/dispatch_dashboard/stops_tomorrow');
            // First get stop data
            ref.child(id).once('value').then(snap => {
                const stop = snap.val();
                if (!stop) return;
                // Update assignment
                ref.child(id).update({ assignedDriver: driverId || null });
                // If assigning to a driver and driver has phone, send SMS
                if (driverId && drivers[driverId] && drivers[driverId].phone) {
                    const driver = drivers[driverId];
                    const stopName = stop.name || 'Stop';
                    const stopAddress = stop.address || '';
                    const stopCity = stop.city || '';
                    // Call Cloud Function
                    sendAssignmentSMS(driverId, driver.phone, stopName, stopAddress, stopCity, id);
                }
                if (activeModalDriverId) renderDriverStops(activeModalDriverId);
            });
        }

        function sendAssignmentSMS(driverId, driverPhone, stopName, address, city, stopId) {
            const sendSMS = firebase.functions().httpsCallable('sendAssignmentSMS');
            sendSMS({
                driverId: driverId,
                driverPhone: driverPhone,
                stopName: stopName,
                address: address,
                city: city,
                stopId: stopId,
                day: currentDay
            }).catch(err => {
                console.error('SMS send error:', err);
                // Optionally show a toast notification
            });
        }

        function moveToTomorrow(id) {
            const refToday = db.ref('developer/dispatch_dashboard/stops_today');
            const refTomorrow = db.ref('developer/dispatch_dashboard/stops_tomorrow');
            refToday.child(id).once('value').then(snap => {
                const val = snap.val();
                if (!val) return;
                refTomorrow.push(val).then(() => {
                    refToday.child(id).remove().then(() => {
                        updateMapMarkers();
                    });
                });
            });
        }

        function deleteStop(id) {
            if (!confirm('Delete stop?')) return;
            const ref = currentDay === 'today' ? db.ref('developer/dispatch_dashboard/stops_today') : db.ref(
                'developer/dispatch_dashboard/stops_tomorrow');
            ref.child(id).remove().then(() => {
                updateMapMarkers();
            });
        }

        function switchDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-toggle button').forEach(b => b.classList.toggle('active', b.dataset.day ===
            day));
            document.getElementById('dayLabel').textContent = day === 'today' ? 'Today' : 'Tomorrow';
            renderStopList();
            closeDriverModal();
            updateMapMarkers();
        }

        function nextDayPrompt() {
            if (confirm('Move all pending stops to tomorrow? Completed stops will be cleared.')) {
                const refToday = db.ref('developer/dispatch_dashboard/stops_today');
                const refTomorrow = db.ref('developer/dispatch_dashboard/stops_tomorrow');
                refToday.once('value').then(snap => {
                    const data = snap.val() || {};
                    const pending = Object.entries(data).filter(([id, s]) => s.status !== 'completed');
                    const updates = {};
                    pending.forEach(([id, s]) => { updates[id] = s; });
                    refTomorrow.update(updates).then(() => {
                        const removes = {};
                        Object.keys(data).forEach(id => { removes[id] = null; });
                        refToday.update(removes);
                        switchDay('tomorrow');
                    });
                });
            }
        }

        // ===== SETTINGS =====
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
            renderSettingsList();
            getMasterRef().once('value').then(snap => {
                const cfg = snap.val() || {};
                document.getElementById('dispatcherPhone').value = cfg.dispatcherPhone || '';
            });
        }

        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function renderSettingsList() {
            const container = document.getElementById('driverSettingsList');
            container.innerHTML = '';
            for (let [id, drv] of Object.entries(drivers)) {
                const row = document.createElement('div');
                row.className = 'driver-row';
                row.innerHTML = `
              <input type="text" value="${drv.name || ''}" placeholder="Name" data-id="${id}" class="drv-name">
              <input type="text" value="${drv.phone || ''}" placeholder="Phone (e.g., +14165551234)" data-id="${id}" class="drv-phone">
              <input type="color" value="${drv.color || '#f7c948'}" data-id="${id}" class="drv-color color-pick">
              <input type="text" value="${drv.deviceId || ''}" placeholder="Device ID" data-id="${id}" class="drv-device">
              <button class="remove-driver" onclick="removeDriver('${id}')">✕</button>
            `;
                container.appendChild(row);
            }
        }

        function addDriverRow() {
            const ref = getDriversRef();
            ref.push({ name: 'Driver', color: '#f7c948', deviceId: '', phone: '', lastLocation: null });
        }

        function removeDriver(id) {
            if (!confirm('Remove this driver? All assigned stops will be unassigned.')) return;
            const ref = getDriversRef();
            ref.child(id).remove();
            const refToday = db.ref('developer/dispatch_dashboard/stops_today');
            const refTomorrow = db.ref('developer/dispatch_dashboard/stops_tomorrow');
            refToday.once('value').then(snap => {
                const data = snap.val() || {};
                const updates = {};
                Object.entries(data).filter(([id, s]) => s.assignedDriver === id).forEach(([id]) => { updates[
                        `${id}/assignedDriver`] = null; });
                refToday.update(updates);
            });
            refTomorrow.once('value').then(snap => {
                const data = snap.val() || {};
                const updates = {};
                Object.entries(data).filter(([id, s]) => s.assignedDriver === id).forEach(([id]) => { updates[
                        `${id}/assignedDriver`] = null; });
                refTomorrow.update(updates);
            });
        }

        function saveSettings() {
            const email = document.getElementById('pajEmail').value.trim();
            const pass = document.getElementById('pajPassword').value.trim();
            const dispatcherPhone = document.getElementById('dispatcherPhone').value.trim();
            getMasterRef().update({ paj_email: email, paj_password: pass, dispatcherPhone: dispatcherPhone });
            const rows = document.querySelectorAll('#driverSettingsList .driver-row');
            rows.forEach(row => {
                const id = row.querySelector('.drv-name').dataset.id;
                const name = row.querySelector('.drv-name').value;
                const phone = row.querySelector('.drv-phone').value;
                const color = row.querySelector('.drv-color').value;
                const deviceId = row.querySelector('.drv-device').value;
                if (id) {
                    getDriversRef().child(id).update({ name, phone, color, deviceId });
                }
            });
            if (email && pass) authenticatePAJ();
            renderDriverBadges();
            renderStopList();
            closeSettings();
        }
    </script>
</body>
</html>
