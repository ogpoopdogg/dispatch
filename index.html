<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dispatch · PAJ GPS</title>
    <meta name="theme-color" content="#1a1a2e">
    <link href="//fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b14;
            color: #eaeef2;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        #app {
            flex-direction: column;
            width: 100%;
            flex: 1;
        }
        :root {
            --accent: #f7c948;
            --card: #16161f;
            --card2: #1e1e2a;
            --border: #2a2a3a;
            --text: #eaeef2;
            --muted: #9aa0b0;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0b14;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a4a;
            border-radius: 6px;
        }

        /* Light mode */
        body.light-mode {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb;
            --card2: #f9fafb;
        }
        body.light-mode * {
            color: #000 !important;
        }
        body.light-mode .driver-badge {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
        }
        body.light-mode .stop-item {
            background: #fff;
            border-color: #ddd;
        }
        body.light-mode .add-stop-area {
            background: #f9fafb;
            border-color: #ddd;
        }
        body.light-mode .manifest-panel {
            background: #fff;
            border-color: #ddd;
        }
        body.light-mode .map-wrapper {
            background: #fff;
            border-color: #ddd;
        }
        body.light-mode header {
            background: #fff;
            border-color: #ddd;
        }
        body.light-mode .settings-card {
            background: #fff;
            border-color: #ddd;
        }
        body.light-mode .login-box {
            background: #fff;
            border-color: #ddd;
        }
        body.light-mode .login-box input {
            background: #f9fafb;
            color: #000;
        }
        body.light-mode .login-box button {
            background: #2563eb;
            color: #fff;
        }
        body.light-mode .badge {
            background: #2563eb;
            color: #fff;
        }
        body.light-mode .day-toggle button.active {
            background: #2563eb;
            color: #fff;
        }
        body.light-mode .day-toggle button {
            color: #333;
            background: #fff !important;
            border: 1px solid #ccc !important;
        }
        body.light-mode .header-actions button {
            background: #f9fafb;
            color: #000;
            border-color: #ddd;
        }
        body.light-mode .settings-actions .save-btn {
            background: #2563eb;
            color: #fff;
        }
        body.light-mode .settings-actions .close-btn {
            background: #f9fafb;
            color: #000;
            border: 1px solid #ddd;
        }
        body.light-mode .debug-box {
            background: #f9fafb;
            color: #000;
            border-color: #ddd;
        }
        body.light-mode .suggestions-box {
            background: #fff;
            border-color: #ddd;
        }
        body.light-mode .suggestion-item {
            color: #000;
            border-color: #ddd;
        }
        body.light-mode .suggestion-item:hover {
            background: var(--accent);
            color: #fff;
        }
        body.light-mode #stopDriver {
            background: #f9fafb;
            color: #000;
            border-color: #ddd;
        }
        body.light-mode .stop-item.greyed-out {
            background: #e5e7eb !important;
            opacity: 0.5;
        }
        body.light-mode .stop-item.highlight-unassigned {
            border-color: #2563eb !important;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.7) !important;
        }
        body.light-mode .stop-tooltip {
            background: rgba(0, 0, 0, 0.88);
            color: #fff;
            border: 2px solid #2563eb;
        }
        body.light-mode .stop-tooltip .tooltip-addr {
            color: #fff;
        }
        body.light-mode .driver-badge .status-indicator {
            background: #fff !important;
            border: 1px solid #000 !important;
            color: #000 !important;
        }
        body.light-mode .driver-badge .status-online {
            background: #fff !important;
            border-color: #2ecc71 !important;
            color: #2ecc71 !important;
        }
        body.light-mode .driver-badge .status-standby {
            background: #fff !important;
            border-color: #f1c40f !important;
            color: #f1c40f !important;
        }
        body.light-mode .driver-badge .status-offline {
            background: #fff !important;
            border-color: #e74c3c !important;
            color: #e74c3c !important;
        }
        body.light-mode .driver-badge .last-update {
            color: #666 !important;
        }
        body.light-mode .day-toggle button {
            background: #fff !important;
            border: 1px solid #ccc !important;
            color: #333 !important;
        }
        body.light-mode .day-toggle button.active {
            background: #2563eb !important;
            border-color: #2563eb !important;
            color: #fff !important;
        }

        /* Stop item layout */
        .stop-item .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .stop-item .info .name {
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 0 1 auto;
        }
        .stop-item .info .addr {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1 1 auto;
            text-align: right;
        }
        .stop-item {
            padding: 6px 8px !important;
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: #0b0b14;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: 100%;
            max-width: 360px;
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .login-box h2 {
            color: var(--accent);
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #0b0b14;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .login-box input:focus {
            border-color: var(--accent);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: var(--accent);
            border: none;
            color: #0b0b14;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
        }
        #loginError {
            color: #e74c3c;
            margin-top: 12px;
            font-size: 14px;
        }

        header {
            background: #0f0f18;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 10000;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
            cursor: pointer;
        }
        .logo svg {
            height: 32px;
        }
        .badge {
            background: var(--accent);
            color: #0b0b14;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .header-actions button {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header-actions button:hover {
            background: #2a2a3e;
            border-color: var(--accent);
        }
        .user-email {
            font-size: 13px;
            color: var(--muted);
        }

        .app-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .map-wrapper {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
            height: 380px;
            min-height: 280px;
        }
        .map-wrapper.hidden {
            display: none;
        }
        #dispatch-map {
            width: 100%;
            height: 100%;
        }
        .driver-badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 0;
            width: 100%;
            justify-content: center;
        }
        .driver-badge {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            padding: 10px 18px 10px 14px;
            border-radius: 40px;
            border-left: 4px solid;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            user-select: none;
        }
        .driver-badge:hover {
            background: rgba(30, 30, 50, 0.95);
            transform: scale(1.02);
        }
        .driver-badge .dot {
            width: 12px;
            height: 12px;
            border-radius: 12px;
            display: inline-block;
            flex-shrink: 0;
        }
        .driver-badge .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 4px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid transparent;
        }
        .driver-badge .status-online {
            background: #0a2a1a;
            color: #2ecc71;
            border-color: #2ecc71;
        }
        .driver-badge .status-standby {
            background: #2a2a0a;
            color: #f1c40f;
            border-color: #f1c40f;
        }
        .driver-badge .status-offline {
            background: #2a0a0a;
            color: #e74c3c;
            border-color: #e74c3c;
        }
        .driver-badge .last-update {
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
            margin-left: 2px;
        }
        /* Drag-over highlight for driver badges */
        .driver-badge.drag-over {
            border-color: var(--accent) !important;
            box-shadow: 0 0 20px rgba(247, 201, 72, 0.8), inset 0 0 20px rgba(247, 201, 72, 0.2) !important;
            transform: scale(1.06);
            background: rgba(247, 201, 72, 0.15) !important;
            transition: 0.15s;
        }

        .manifest-panel {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 16px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        /* Dispatch mode glow */
        .manifest-panel.dispatch-mode-glow {
            border-color: var(--accent) !important;
            box-shadow: 0 0 30px rgba(247, 201, 72, 0.4), inset 0 0 30px rgba(247, 201, 72, 0.05) !important;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .panel-header h2 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .day-toggle {
            display: flex;
            gap: 6px;
            background: var(--card2);
            border-radius: 40px;
            padding: 4px;
        }
        .day-toggle button {
            background: transparent;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            transition: 0.2s;
        }
        .day-toggle button.active {
            background: var(--accent);
            color: #0b0b14;
        }
        .add-stop-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            background: var(--card2);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .add-stop-area.hidden {
            display: none;
        }
        .add-stop-area input {
            flex: 1 1 160px;
            background: #0b0b14;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 30px;
            font-size: 14px;
            min-width: 120px;
            outline: none;
        }
        .add-stop-area input:focus {
            border-color: var(--accent);
        }
        .add-stop-area .btn-add {
            background: var(--accent);
            color: #0b0b14;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            margin-left: auto;
        }
        .add-stop-area select {
            flex: 0 0 auto;
            background: #0b0b14;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            min-width: 100px;
        }
        .stop-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .stop-item {
            background: var(--card2);
            border-radius: 14px;
            padding: 6px 8px;
            border-left: 5px solid transparent;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: grab;
            transition: 0.15s;
            border: 1px solid var(--border);
            position: relative;
            flex: 0 0 calc(50% - 6px);
            max-width: calc(50% - 6px);
            box-sizing: border-box;
            user-select: none;
        }
        .stop-item:hover {
            border-color: #3a3a5a;
        }
        .stop-item.completed {
            background: #2a2a3a !important;
            opacity: 0.4;
            order: 999;
        }
        .stop-item .info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .stop-item .info .name {
            font-weight: 600;
            font-size: 12px;
        }
        .stop-item .info .addr {
            font-size: 11px;
            color: var(--muted);
        }
        .stop-item .info .city {
            font-size: 11px;
            color: var(--muted);
        }
        .stop-item .actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stop-item .actions button {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 18px;
            padding: 6px 10px;
            border-radius: 12px;
            transition: 0.2s;
        }
        .stop-item .actions button:hover {
            background: #2a2a3e;
            color: white;
        }
        .stop-item .assign-select {
            background: #0b0b14;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .stop-item .timestamp {
            font-size: 11px;
            color: #2ecc71;
            font-weight: 600;
            margin-left: 4px;
        }

        .stop-item.greyed-out {
            background: #2a2a3a !important;
            opacity: 0.5;
            pointer-events: none;
        }
        .stop-item.greyed-out .info {
            pointer-events: none;
            cursor: default;
        }
        .stop-item.greyed-out .actions {
            opacity: 0.3;
            pointer-events: none;
        }

        .stop-item.highlight-unassigned {
            border-color: var(--accent) !important;
            box-shadow: 0 0 12px rgba(247, 201, 72, 0.6) !important;
            animation: glow-pulse 1.2s ease-in-out infinite alternate;
            cursor: pointer;
        }
        .stop-item.highlight-unassigned .info {
            cursor: pointer;
        }
        @keyframes glow-pulse {
            0% {
                box-shadow: 0 0 8px rgba(247, 201, 72, 0.3);
            }
            100% {
                box-shadow: 0 0 20px rgba(247, 201, 72, 0.8);
            }
        }

        /* ===== GLOBAL TOOLTIP ===== */
        #globalTooltip {
            display: none;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(6px);
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            border: 2px solid var(--accent);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 0 4px rgba(247, 201, 72, 0.15);
            max-width: 400px;
            min-width: 180px;
            line-height: 1.4;
            transition: opacity 0.15s;
            transform: translate(12px, -8px);
            font-family: 'Inter', sans-serif;
        }
        #globalTooltip .tooltip-name {
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            margin-bottom: 2px;
        }
        #globalTooltip .tooltip-addr {
            color: #d0d0d0;
            font-size: 14px;
        }
        #globalTooltip .tooltip-city {
            color: #aaa;
            font-size: 13px;
        }
        #globalTooltip .tooltip-driver {
            font-size: 12px;
            color: var(--accent);
            margin-top: 3px;
            font-weight: 500;
        }

        .stop-item .stop-tooltip {
            display: none !important;
        }

        /* ===== MANIFEST SEARCH ===== */
        .manifest-search {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
        }
        .manifest-search input {
            flex: 1;
            background: #0b0b14;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            width: 100%;
            min-width: 0;
        }
        .manifest-search input:focus {
            border-color: var(--accent);
        }
        .manifest-search input::placeholder {
            color: var(--muted);
        }
        .manifest-search .clear-search {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 18px;
            padding: 0 10px;
            display: none;
            align-items: center;
        }
        .manifest-search .clear-search.visible {
            display: flex;
        }

        .copy-btn-header {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .copy-btn-header:hover {
            background: #2a2a3e;
            border-color: var(--accent);
        }
        .copy-btn-header.copied {
            border-color: #2ecc71;
            background: #0a2a1a;
            color: #2ecc71;
        }

        .driver-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .driver-modal .modal-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .driver-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .driver-modal .modal-header h2 {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .driver-modal .modal-map {
            height: 260px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #0b0b14;
            position: relative;
        }
        .driver-modal .modal-map #driver-map {
            width: 100%;
            height: 100%;
        }
        .driver-modal .modal-stops {
            max-height: 240px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .driver-modal .modal-stops .stop-item {
            background: #12121c;
            flex: 0 0 calc(50% - 6px);
            max-width: calc(50% - 6px);
            padding: 6px 8px;
            box-sizing: border-box;
        }
        .driver-modal .modal-stops .stop-item .info {
            cursor: pointer;
        }

        .settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .settings-modal .settings-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            max-width: 620px;
            width: 100%;
            padding: 28px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .settings-card h2 {
            margin-bottom: 20px;
        }
        .settings-card .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>DISPATCH LOGIN</h2>
            <input type="email" id="loginEmail" placeholder="Email (@ec.com)" autofocus>
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Sign In</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display:none;">
        <!-- Header -->
        <header>
            <div style="display: flex; align-items: center; gap: 10px; flex-shrink:0;">
                <img src="icon2.png" onclick="toggleTheme()" style="height:32px; width:auto; cursor:pointer;" alt="Logo" />
                <span style="font-size:16px; font-weight:700; color:var(--text);">E&C DISPATCH</span>
                <span class="badge">LIVE</span>
                <button class="copy-btn-header" onclick="copyStopNames()" title="Copy all remaining stop names to clipboard">📋 COPY</button>
            </div>
            <div style="display: flex; align-items: center; gap: 6px; margin-left: auto;">
                <button class="gear-btn" onclick="openSettings()" title="Drivers">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                </button>
                <button onclick="toggleMapVisibility()" id="mapToggleBtn" style="background:var(--card2); border:1px solid #3b82f6; color:var(--text); padding:8px 16px; border-radius:30px; font-weight:600; font-size:13px; cursor:pointer;">
                    <svg viewBox="0 0 24 24" style="width:16px; height:16px; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:2;"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    Map
                </button>
                <button onclick="toggleDispatchMode()" id="dispatchBtn" class="dispatch-btn">Dispatch</button>
            </div>
        </header>

        <div class="app-grid">
            <div class="map-wrapper hidden" id="mainMapWrapper">
                <div id="dispatch-map"></div>
            </div>
            <div class="driver-badge-container" id="driverBadges"></div>

            <div class="manifest-panel" id="manifestPanel">
                <div class="panel-header">
                    <h2>Manifest <span id="dayLabel" style="font-size:14px; font-weight:400; color:var(--muted);">Today</span></h2>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="manifest-map-btn" id="manifestMapBtn" onclick="toggleMapVisibility()" title="Toggle Map">
                            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                            Map
                        </button>
                        <div class="day-toggle">
                            <button class="active" data-day="today" onclick="switchDay('today')">Today</button>
                            <button data-day="tomorrow" onclick="switchDay('tomorrow')">Tomorrow</button>
                        </div>
                    </div>
                </div>

                <!-- Search bar -->
                <div class="manifest-search">
                    <input type="text" id="manifestSearchInput" placeholder="Search by name or address..." oninput="filterStops()">
                    <button class="clear-search" id="manifestSearchClear" onclick="clearSearch()">✕</button>
                </div>

                <div class="add-stop-area hidden">
                    <div class="input-with-suggestions">
                        <input type="text" id="stopName" placeholder="Contact/Business Name" autocomplete="off" oninput="handleNameInput(this.value)">
                        <div id="nameSuggestions" class="suggestions-box"></div>
                    </div>
                    <input type="text" id="stopAddress" placeholder="Address">
                    <input type="text" id="stopCity" placeholder="City">
                    <select id="stopDriver" style="flex:0 0 auto; background:#0b0b14; border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:30px; font-size:14px; outline:none; min-width:100px;">
                        <option value="">Unassigned</option>
                    </select>
                    <button class="btn-add" onclick="addStop()">+ Add</button>
                </div>

                <div class="stop-list" id="stopList"></div>
                <div id="emptyMsg" style="text-align:center; color:var(--muted); padding:20px;">No stops — add one above.</div>
            </div>
        </div>
    </div>

    <!-- Dispatch Overlay -->
    <div id="dispatchOverlay" style="display:none; position:fixed; inset:0; background:transparent; z-index:9998; cursor:pointer;"></div>

    <!-- Driver Modal -->
    <div class="driver-modal" id="driverModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="driverModalTitle">Driver</h2>
                <button onclick="closeDriverModal()" style="background:transparent; border:none; color:white; font-size:28px; cursor:pointer;">✕</button>
            </div>
            <div class="modal-map"><div id="driver-map"></div></div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0;">
                <span id="driverLastUpdate" style="font-size:13px; color:var(--muted);">Last update: —</span>
                <span id="driverStopCount" style="font-weight:600;">0 stops</span>
            </div>
            <div id="driverAddress" style="font-size:13px; color:var(--muted); padding:4px 0;"></div>
            <div class="modal-stops" id="driverModalStops"></div>
        </div>

        // ===== GPS STATUS HELPER =====
        function getGPSStatus(lastUpdated, driverId) {
            if (driverId && deviceStatuses[driverId] !== undefined) {
                const connStatus = deviceStatuses[driverId];
                if (connStatus === 1) {
                    return { status: 'online', label: '● Online', class: 'status-online' };
                } else if (connStatus === 2) {
                    return { status: 'standby', label: '◐ Standby', class: 'status-standby' };
                } else {
                    return { status: 'offline', label: '○ Offline', class: 'status-offline' };
                }
            }
            if (!lastUpdated) return { status: 'offline', label: '○ Offline', class: 'status-offline' };
            const diff = Date.now() - lastUpdated;
            if (diff < STANDBY_THRESHOLD) return { status: 'online', label: '● Online', class: 'status-online' };
            if (diff < OFFLINE_THRESHOLD) return { status: 'standby', label: '◐ Standby', class: 'status-standby' };
            return { status: 'offline', label: '○ Offline', class: 'status-offline' };
        }

        // ===== TEST PAJ CONNECTION =====
        async function testPAJConnection() {
            const debug = document.getElementById('debugOutput');
            const email = document.getElementById('pajEmail').value.trim();
            const pass = document.getElementById('pajPassword').value.trim();

            debug.innerHTML = '<span class="info">⏳ Testing connection...</span>';
            if (!email || !pass) {
                debug.innerHTML = '<span class="error">❌ Please enter your PAJ GPS email and password first.</span>';
                return;
            }
            try {
                const loginRes = await fetch(`${PAJ_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });
                const loginData = await loginRes.json();
                let token = loginData.success?.token || loginData.token;
                if (!token) {
                    debug.innerHTML += `<span class="error">❌ Login failed.</span>`;
                    return;
                }
                debug.innerHTML += `<span class="success">✅ Login successful!</span><br><br>`;
                const deviceRes = await fetch(`${PAJ_BASE}/device`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const devicesData = await deviceRes.json();
                let devices = devicesData.success || devicesData.data || devicesData;
                if (!Array.isArray(devices)) {
                    debug.innerHTML += `<span class="error">❌ No devices found.</span>`;
                    return;
                }
                let html = `<span class="success">✅ Found ${devices.length} device(s):</span><br><br>`;
                devices.forEach((d, i) => {
                    const devId = d.id || d.deviceId || d.imei || 'Unknown';
                    const name = d.name || d.deviceName || `Device ${i+1}`;
                    html += `<span class="info">${i+1}. </span><strong>${name}</strong><br>`;
                    html += `   📱 Device ID: <span class="device-id">${devId}</span><br>`;
                });
                html += `<span class="info">💡 Copy the Device ID and paste into each driver's settings.</span>`;
                debug.innerHTML = html;
                pajToken = token;
                getMasterRef().update({ paj_token: token });
                await fetchAllDevicePositions();
            } catch (e) {
                debug.innerHTML += `<span class="error">❌ Error: ${e.message}</span>`;
            }
        }

                });

            function showSuggestions(val) {
                if (!val || val.length < 1) {
                    suggestionsBox.style.display = 'none';
                    return;
                }
                const lowerVal = val.toLowerCase().trim();
                const matches = Object.keys(addressLookupMap).filter(name =>
                    name.toLowerCase().includes(lowerVal)
                );
                if (matches.length === 0) {
                    suggestionsBox.style.display = 'none';
                    return;
                }
                const limited = matches.slice(0, 10);
                suggestionsBox.innerHTML = limited.map(name =>
                    `<div class="suggestion-item" data-name="${name.replace(/'/g, "\\'")}">${name}</div>`
                ).join('');
                suggestionsBox.style.display = 'block';
            }

            suggestionsBox.addEventListener('click', function(e) {
                const target = e.target.closest('.suggestion-item');
                if (!target) return;
                const name = target.dataset.name;
                if (name && addressLookupMap[name]) {
                    document.getElementById('stopName').value = name;
                    document.getElementById('stopAddress').value = addressLookupMap[name].address || '';
                    document.getElementById('stopCity').value = addressLookupMap[name].city || '';

                }
            });

            input.addEventListener('blur', function() {
                setTimeout(() => {

                }, 200);

        function startPulseAnimation() {
            if (pulseAnimationId) cancelAnimationFrame(pulseAnimationId);
            let startTime = performance.now();

            function animate(time) {
                const elapsed = (time - startTime) / 1000;
                const baseRadius = 15;
                const amplitude = 8;
                const radius = baseRadius + amplitude * Math.sin(elapsed * 2.5);
                for (let id in driverPulseCircles) {
                    const circle = driverPulseCircles[id];
                    if (circle) circle.setRadius(radius);
                }
                pulseAnimationId = requestAnimationFrame(animate);
            }
            pulseAnimationId = requestAnimationFrame(animate);
        }

        function startModalPulse(circle) {
            if (modalPulseAnimationId) cancelAnimationFrame(modalPulseAnimationId);
            let startTime = performance.now();

            function animate(time) {
                const elapsed = (time - startTime) / 1000;
                const baseRadius = 15;
                const amplitude = 8;
                const radius = baseRadius + amplitude * Math.sin(elapsed * 2.5);
                if (circle) circle.setRadius(radius);
                modalPulseAnimationId = requestAnimationFrame(animate);
            }
            modalPulseAnimationId = requestAnimationFrame(animate);
        }

        function stopModalPulse() {

                modalPulseAnimationId = null;

            return new Promise((resolve, reject) => {
                const geocoder = new google.maps.Geocoder();
                geocoder.geocode({ location: { lat, lng } }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        resolve(results[0].formatted_address);
                    } else {
                        reject('Unable to get address');
                    }
                });
            });
        }

                        localStorage.setItem('ec_map_visible', 'false');
                    }
                }
            }).catch(() => {
                getMasterRef().set({ paj_email: '', paj_password: '', paj_token: '' });
            });
            if (gpsInterval) clearInterval(gpsInterval);
            gpsInterval = setInterval(() => {
                if (pajToken) fetchAllDevicePositions();
                updateGlobalUpdateTime();
            }, 15000);
            setTimeout(() => {
                if (pajToken) fetchAllDevicePositions();
            }, 3000);
            initBusinessAutocomplete();

            document.getElementById('dispatchOverlay').addEventListener('click', exitDispatchMode);
        }

        function updateGlobalUpdateTime() {

                el.textContent = '⏱ ' + new Date().toLocaleTimeString();

        // ===== DISPATCH MODE =====

        function enterDispatchMode() {

        // ===== PAJ GPS =====
        async function authenticatePAJ() {
            const email = document.getElementById('pajEmail').value.trim();
            const pass = document.getElementById('pajPassword').value.trim();
            if (!email || !pass) return;
            try {
                const response = await fetch(`${PAJ_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });
                const data = await response.json();
                let token = data.success?.token || data.token;
                if (token) {
                    pajToken = token;
                    getMasterRef().update({ paj_token: token });
                    await fetchAllDevicePositions();
                }
            } catch (e) { console.warn('PAJ auth error:', e); }
        }

        let authRetryInProgress = false;
        let lastDateUnix = {};

        async function fetchAllDevicePositions() {
            if (!pajToken) return;

            const deviceEntries = Object.entries(drivers).filter(([id, drv]) => drv.deviceId && String(drv.deviceId).trim() !==
                '');
            if (deviceEntries.length === 0) {
                console.log('📡 No driver device IDs configured.');
                return;
            }

            const deviceIds = deviceEntries.map(([did, drv]) => parseInt(String(drv.deviceId).trim(), 10));
            const payload = { devicesId: deviceIds };
            console.log('📡 Sending payload to getAllDeviceStatus:', JSON.stringify(payload));

            try {
                const response = await fetch(`${PAJ_BASE}/getAllDeviceStatus`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${pajToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                if (response.status === 401 || response.status === 403) {
                    console.warn('🔑 Token expired, re-authenticating...');
                    if (!authRetryInProgress) {
                        authRetryInProgress = true;
                        await authenticatePAJ();
                        authRetryInProgress = false;
                        await fetchAllDevicePositions();
                        return;
                    }
                    return;
                }
                if (!response.ok) {
                    console.warn('❌ getAllDeviceStatus returned status', response.status);
                    return;
                }
                const data = await response.json();
                console.log('📨 getAllDeviceStatus response:', data);
                if (!data.success || typeof data.success !== 'object') {
                    console.warn('⚠️ No success object in response.');
                    return;
                }

                let updated = false;
                const now = Date.now();
                for (const [deviceIdStr, deviceData] of Object.entries(data.success)) {
                    const devId = parseInt(deviceIdStr, 10);
                    if (!devId) continue;

                    const deviceStatus = deviceData.deviceStatus || {};
                    const connectionStatus = deviceStatus.connection_status;
                    if (connectionStatus !== undefined) {
                        deviceStatuses[devId] = connectionStatus;
                        console.log(`📡 Device ${devId}: connection_status=${connectionStatus}`);
                    } else {
                        console.warn(`⚠️ No connection_status for device ${devId}`);
                    }

                    const lastPoint = deviceData.lastPoint || null;
                    if (lastPoint && lastPoint.lat !== undefined && lastPoint.lng !== undefined) {
                        const lat = lastPoint.lat;
                        const lng = lastPoint.lng;
                        if (!isNaN(lat) && !isNaN(lng)) {
                            const tsSec = lastPoint.dateunix;
                            let pajTimestamp = now;
                            if (tsSec && !isNaN(tsSec)) pajTimestamp = tsSec * 1000;
                            if (tsSec && !isNaN(tsSec)) lastDateUnix[devId] = tsSec;
                            console.log(`📍 Device ${devId}: lat=${lat}, lng=${lng}, timestamp=${pajTimestamp}`);
                            let matched = false;
                            for (let [did, drv] of Object.entries(drivers)) {
                                const drvDeviceId = drv.deviceId ? String(drv.deviceId).trim() : '';
                                if (drvDeviceId && drvDeviceId === String(devId)) {
                                    matched = true;
                                    drv.lastLocation = { lat, lng, updatedAt: pajTimestamp };
                                    getDriversRef().child(did).update({ lastLocation: drv.lastLocation });
                                    updated = true;
                                    break;
                                }
                            }
                            if (!matched) console.log(`⚠️ No driver configured for device ${devId}`);
                        }
                    } else {
                        console.log(`ℹ️ No position for device ${devId}`);
                    }
                }

                if (updated) {
                    updateMapMarkers();
                    renderDriverBadges();
                    updateMapDriverControl();
                } else {
                    console.log('ℹ️ No driver updates from this response.');
                }
            } catch (e) {
                console.warn('❌ Fetch error:', e);
            }
        }

        // ===== MAP =====
        let mapInitialized = false;

        function initMap() {
            if (mapInitialized) return;
            const isLight = document.body.classList.contains('light-mode');
            map = new google.maps.Map(document.getElementById('dispatch-map'), {
                center: { lat: 49.8425, lng: -99.9497 },
                zoom: 11,
                styles: isLight ? [] : mapStyles,
                gestureHandling: 'greedy',
                mapTypeControl: false
            });
            mapInitialized = true;

            const driverControlDiv = document.createElement('div');
            driverControlDiv.id = 'mapDriverControl';
            driverControlDiv.className = 'map-driver-control';
            map.controls[google.maps.ControlPosition.TOP_LEFT].push(driverControlDiv);
            updateMapDriverControl();

            updateMapMarkers();
            try {
                new google.maps.places.Autocomplete(document.getElementById('stopAddress'), { componentRestrictions: {
                        country: 'ca' } });
            } catch (e) {}

            map.addListener('click', function() {
                const current = map.get('scrollwheel');
                map.setOptions({ scrollwheel: !current });
            });

            const fitControlDiv = document.createElement('div');
            fitControlDiv.innerHTML = `
            <button class="map-fit-btn" aria-label="Fit all stops">
              <svg viewBox="0 0 24 24"><path d="M3 3v6h2V5h4V3H3zm16 0v6h2V3h-6v2h4zM3 21v-6h2v4h4v2H3zm16 0v-6h2v6h-6v-2h4z"/><rect x="5" y="5" width="14" height="14" rx="1" stroke="currentColor" fill="none"/></svg>
            </button>
          `;
            const fitButton = fitControlDiv.querySelector('.map-fit-btn');
            fitButton.addEventListener('click', function(e) {
                e.stopPropagation();
                fitMainMapToStopsAndDrivers();
            });
            map.controls[google.maps.ControlPosition.BOTTOM_RIGHT].push(fitControlDiv);

            google.maps.event.addListener(map, 'idle', function() {
                const center = map.getCenter();
                const zoom = map.getZoom();
                if (center && zoom) {
                    getMasterRef().update({
                        map_center_lat: center.lat(),
                        map_center_lng: center.lng(),
                        map_zoom: zoom
                    });
                }
            });

            const mapVisible = localStorage.getItem('ec_map_visible');
            if (mapVisible === 'false') {
                const wrapper = document.getElementById('mainMapWrapper');
                wrapper.classList.add('hidden');
                document.getElementById('mapToggleBtn').classList.remove('map-open');
                document.getElementById('manifestMapBtn').classList.remove('map-open');
            } else {
                document.getElementById('mapToggleBtn').classList.add('map-open');
                document.getElementById('manifestMapBtn').classList.add('map-open');
            }
        }

        function fitMainMapToStopsAndDrivers() {
            const allStops = currentDay === 'today' ? stopsToday : stopsTomorrow;
            const bounds = new google.maps.LatLngBounds();
            let hasPoints = false;
            Object.values(allStops).forEach(s => {
                if (s.lat && s.lng) {
                    bounds.extend({ lat: s.lat, lng: s.lng });
                    hasPoints = true;
                }
            });
            Object.values(drivers).forEach(drv => {
                if (drv.lastLocation && drv.lastLocation.lat && drv.lastLocation.lng) {
                    bounds.extend({ lat: drv.lastLocation.lat, lng: drv.lastLocation.lng });
                    hasPoints = true;
                }
            });
            if (hasPoints) {
                map.fitBounds(bounds);
            }
        }

        // ===== UPDATE MAP MARKERS =====
        function updateMapMarkers() {
            if (!map) return;

            Object.values(driverMarkers).forEach(m => m.setMap(null));
            stopMarkers.forEach(m => m.setMap(null));
            driverMarkers = {};
            stopMarkers = [];

            for (let id in driverPulseCircles) {
                driverPulseCircles[id].setMap(null);
            }
            driverPulseCircles = {};

            // Drivers
            for (let [id, drv] of Object.entries(drivers)) {
                if (!drv.lastLocation) continue;
                const pos = drv.lastLocation;
                const color = drv.color || '#f7c948';
                const icon = getDriverIcon(drv.name || 'Driver', color);
                const marker = new google.maps.Marker({
                    position: { lat: pos.lat, lng: pos.lng },
                    map: map,
                    icon: icon
                });
                driverMarkers[id] = marker;

                marker.addListener('click', function() {
                    enterAssignmentMode(id);
                });

                const circle = new google.maps.Circle({
                    center: { lat: pos.lat, lng: pos.lng },
                    radius: 15,
                    fillColor: color,
                    fillOpacity: 0.2,
                    strokeColor: color,
                    strokeOpacity: 0.6,
                    strokeWeight: 2,
                    map: map
                });
                driverPulseCircles[id] = circle;
            }

            if (Object.keys(driverPulseCircles).length > 0) {
                startPulseAnimation();
            } else {
                if (pulseAnimationId) cancelAnimationFrame(pulseAnimationId);
            }

            // Stops
            const allStops = currentDay === 'today' ? stopsToday : stopsTomorrow;
            const entries = Object.entries(allStops)
                .filter(([id, s]) => s.lat && s.lng)
                .sort((a, b) => (a[1].order || 0) - (b[1].order || 0));

            entries.forEach(([id, s], index) => {
                const pos = { lat: s.lat, lng: s.lng };
                const labelText = `${index+1}. ${s.name || 'Stop'}`;
                const marker = new google.maps.Marker({
                    position: pos,
                    map: map,
                    label: {
                        text: labelText,
                        color: '#00b32d',
                        fontWeight: 'bold',
                        fontSize: '11px',
                        className: 'driver-map-label'
                    },
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 12,
                        fillColor: '#ff9800',
                        fillOpacity: 1,
                        strokeColor: 'white',
                        strokeWeight: 2
                    }
                });
                marker.set('stopId', id);
                marker.addListener('click', function() {
                    handleMainMapStopClick(id);
                });
                marker.addListener('dblclick', function() {
                    openGoogleMaps(pos.lat, pos.lng);
                });
                stopMarkers.push(marker);
            });
        }

        // ===== ASSIGNMENT MODE =====

            background: var(--accent);

        function exitAssignmentMode(render) {

            if (banner) banner.remove();
            if (render !== false) {
                renderStopList();
            }

        function handleStopClick(stopId) {
            if (assignmentModeActive && selectedDriverForAssignment) {
                assignStop(stopId, selectedDriverForAssignment);
                renderStopList();
                if (activeModalDriverId) renderDriverStops(activeModalDriverId);
            } else {
                openMapAndZoomToStop(stopId);
            }
