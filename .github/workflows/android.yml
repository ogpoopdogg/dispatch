name: Build Android app

on:
  push:
    branches: ['**', '!live']
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the APK as a GitHub Release (easy to download on a phone)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test the push notification function
        working-directory: functions
        run: npm ci && node --test

      - name: Smoke test the dispatch page in a browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/smoke.cjs

      - name: Copy the web app into the Android project
        run: npm ci && npm run sync

      - name: Test updates without a new APK (starter page)
        run: |
          npm install --no-save playwright@1.63.0   # npm ci above cleared the one the smoke test used
          node tests/live-update.cjs

      # Phones with the app pick these screens up by themselves (see "Updates without a new APK" in
      # APP-SETUP.md). Only from main, and only after the tests above passed.
      - name: Publish the screens for phones (live branch)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$RUNNER_TEMP/live"
          rm -rf "$D" && mkdir -p "$D"
          cp www/app.html "$D/app.html"
          cd "$D"
          git init -q -b live
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add app.html
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Screens from build ${{ github.run_number }} (${{ github.sha }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" live
          echo "Published build ${{ github.run_number }} to the live branch"

      - name: Add Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          if [ -f android/app/google-services.json ]; then
            echo "PUSH=yes" >> "$GITHUB_ENV"
          else
            echo "PUSH=no" >> "$GITHUB_ENV"
            echo "::warning::No google-services.json, so this APK can't receive push notifications. See APP-SETUP.md, step 2."
          fi

      # The app's signing key lives in the repo only encrypted (android/signing/ec-dispatch.p12.enc).
      # The one secret ANDROID_KEYSTORE_PASSWORD unlocks it. Same key every build = updates install over the old app.
      - name: Set up release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.p12"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          elif [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -f android/signing/ec-dispatch.p12.enc ]; then
            if ! printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
                -in android/signing/ec-dispatch.p12.enc -out "$KS" -pass stdin; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD doesn't unlock android/signing/ec-dispatch.p12.enc. Check the secret has no extra spaces."
              exit 1
            fi
            echo "ANDROID_KEY_ALIAS=ecdispatch" >> "$GITHUB_ENV"
          fi
          if [ -s "$KS" ]; then
            echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
            echo "Signing key fingerprint (must stay the same on every build):"
            keytool -list -v -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E 'SHA1:|SHA256:' || true
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
            echo "::warning::No signing key secrets, so this is a debug build. Each debug build has a different key: uninstall the old app before installing a new one. See APP-SETUP.md, step 5."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Older 4-secret setup still works; the encrypted key uses one password for the store and the key
          export ANDROID_KEY_ALIAS="${SECRET_KEY_ALIAS:-${ANDROID_KEY_ALIAS:-}}"
          export ANDROID_KEY_PASSWORD="${SECRET_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          chmod +x gradlew
          TASK=assemble$(echo "${VARIANT:0:1}" | tr a-z A-Z)${VARIANT:1}
          ./gradlew "$TASK" -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/$VARIANT/*.apk "../dist/ec-dispatch-${{ github.run_number }}-$VARIANT.apk"
          ls -la ../dist

      - uses: actions/upload-artifact@v6
        with:
          name: ec-dispatch-${{ github.run_number }}-${{ env.VARIANT }}${{ env.PUSH == 'no' && '-no-push' || '' }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "E&C Dispatch build ${{ github.run_number }}" \
            --notes "Android app. Open this page on the phone and tap the .apk to install."
