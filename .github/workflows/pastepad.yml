name: Build PastePad (text editor)

on:
  push:
    paths:
      - 'tools/text-editor/**'
      - '.github/workflows/pastepad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/text-editor
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "pastepad-${{ github.run_number }}.apk"
          ls -l *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pastepad-${{ github.run_number }}
          path: tools/text-editor/pastepad-${{ github.run_number }}.apk

      - name: Publish as a GitHub Release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pastepad-${{ github.run_number }}" "pastepad-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "PastePad build ${{ github.run_number }}" \
            --notes "Tiny text editor. Install the APK, paste, tap Paste + Save .txt. Files go to Downloads."
